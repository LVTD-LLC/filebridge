name: Deploy Prod

on:
  push:
    branches:
      - main

concurrency:
  group: rowset-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PROJECT_NAME: rowset
  CAPROVER_APP_NAME: rowset

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare image name and tags
        id: image
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.candidate_tag }}
          labels: |
            org.opencontainers.image.title=${{ env.PROJECT_NAME }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify published platforms
        run: deployment/verify-image-platforms.sh "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.candidate_tag }}" linux/amd64 linux/arm64

      - name: Smoke published platforms
        run: deployment/smoke-image-platforms.sh "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.candidate_tag }}"

      - name: Verify anonymous candidate availability
        timeout-minutes: 15
        run: |
          deployment/verify-anonymous-image.sh \
            "${{ steps.build.outputs.digest }}" \
            "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.candidate_tag }}"

      - name: Log in to GHCR for tag promotion
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Protect immutable SHA tag
        run: |
          deployment/verify-immutable-image-tag.sh \
            "${{ steps.build.outputs.digest }}" \
            "${{ steps.image.outputs.image_name }}:${{ github.sha }}"

      - name: Promote advertised tags
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image.outputs.image_name }}:${{ github.sha }}" \
            "${{ steps.image.outputs.image_name }}@${{ steps.build.outputs.digest }}"

      - name: Verify anonymous image availability
        timeout-minutes: 15
        run: |
          deployment/verify-anonymous-image.sh \
            "${{ steps.build.outputs.digest }}" \
            "${{ steps.image.outputs.image_name }}:${{ github.sha }}"

      - name: Deploy server to CapRover
        uses: caprover/deploy-from-github@c221bd9d1c3a55de4c2b66c0dc4a3972d04c027c # v1.2.0
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ env.CAPROVER_APP_NAME }}
          token: ${{ secrets.APP_TOKEN }}
          image: ${{ steps.image.outputs.image_name }}:${{ github.sha }}

      - name: Deploy workers to CapRover
        uses: caprover/deploy-from-github@c221bd9d1c3a55de4c2b66c0dc4a3972d04c027c # v1.2.0
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ env.CAPROVER_APP_NAME }}-workers
          token: ${{ secrets.WORKERS_APP_TOKEN }}
          image: ${{ steps.image.outputs.image_name }}:${{ github.sha }}
