{% if cell.row_url %}
  <a href="{{ cell.row_url }}" class="fb-focus fb-formula-value {% if formula_value_compact %}max-w-64{% else %}max-w-full{% endif %}" title="{{ cell.value }}"{% if cell.is_row_detail_primary %} aria-label="{{ cell.row_detail_label }}"{% else %} aria-hidden="true" tabindex="-1"{% endif %}>
    <span class="font-mono text-xs" aria-hidden="true">ƒ</span>
    <span class="{% if formula_value_compact %}truncate{% else %}whitespace-pre-wrap break-words{% endif %}">{{ cell.value }}</span>
  </a>
{% else %}
  <span class="fb-formula-value {% if formula_value_compact %}max-w-64{% else %}max-w-full{% endif %}" title="{{ cell.value }}">
    <span class="font-mono text-xs" aria-hidden="true">ƒ</span>
    <span class="{% if formula_value_compact %}truncate{% else %}whitespace-pre-wrap break-words{% endif %}">{{ cell.value }}</span>
  </span>
{% endif %}
